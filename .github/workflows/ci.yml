name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # ruff 版本锁定在 pyproject.toml 的 dev 依赖组里
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .
      # 中英文更新日志的版本标题必须一一对应
      - name: Check CHANGELOG translations are in sync
        run: diff <(grep -o '^## \[[^]]*\]' CHANGELOG.md) <(grep -o '^## \[[^]]*\]' CHANGELOG.zh-CN.md)

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 最低版本 3.9 是 macOS 自带的 /usr/bin/python3，单文件运行时会用到
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest .
      - run: python -m pytest
      - run: claude-session-sync --version
      # 单文件运行方式（README 里的 curl 下载）也要能用
      - run: python src/claude_session_sync/cli.py --version

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - run: uvx twine check --strict dist/*
