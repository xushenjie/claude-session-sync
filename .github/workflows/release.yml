name: Release

# 推送 v* 标签时：校验版本号 → 构建 → 发布到 PyPI → 创建 GitHub Release。
# 首次使用前需要在 PyPI 配置 Trusted Publisher（见 CONTRIBUTING.md）。

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Check tag matches __version__
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/claude_session_sync/cli.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - name: Check CHANGELOG has an entry
        run: |
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.zh-CN.md
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/claude-session-sync-cli/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
